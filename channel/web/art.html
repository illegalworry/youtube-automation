<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Lilita;src:url(fonts/lilita.woff2) format('woff2')}html,body{margin:0;background:#000}</style></head>
<body><canvas id="c"></canvas>
<script>window.addEventListener('error',e=>{window.err=String(e.message)});</script>
<script type="module">
import * as T from './toon.js';
const NAME = (new URLSearchParams(location.search).get('name') || 'Weirdly True');
const TAG = (new URLSearchParams(location.search).get('tag') || 'Strange true stories, animated');
const which = new URLSearchParams(location.search).get('w') || 'avatar';
await document.fonts.load('200px Lilita');
const cv = document.getElementById('c'), g = cv.getContext('2d');
const INK = '#241726';
// draw a 600x1000 card at (x,y)=sole-centre position with scale s
const card = (fn, x, y, s) => { g.save(); g.translate(x - 300 * s, y - 975 * s); g.scale(s, s); fn(new T.Pen(g)); g.restore(); };
const sky = (w, h, top = '#3e7fd2', hor = '#b8d0ec') => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, top); gr.addColorStop(1, hor); g.fillStyle = gr; g.fillRect(0, 0, w, h); };
const blob = (pts, fill, lw = 8) => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fillStyle = fill; g.fill(); g.lineWidth = lw; g.strokeStyle = INK; g.lineJoin = 'round'; g.stroke(); };
const hill = (w, y0, amp, ph, col, h) => { const pts = []; for (let x = -20; x <= w + 20; x += 20) pts.push([x, y0 - amp * Math.sin(x / w * Math.PI * 1.4 + ph) - amp * 0.4 * Math.sin(x / w * 7 + ph * 2)]); pts.push([w + 20, h + 20], [-20, h + 20]); blob(pts, col, 7); };
const cloud = (x, y, r) => { g.beginPath(); for (const [dx, dy, k] of [[0, 0, 1], [r * .9, r * .15, .8], [-r * .9, r * .2, .75], [r * .4, -r * .45, .8]]) { g.moveTo(x + dx + r * k, y + dy); g.arc(x + dx, y + dy, r * k, 0, 7); } g.fillStyle = '#fff'; g.fill(); g.lineWidth = 7; g.strokeStyle = INK; g.stroke(); g.fill(); };
const title = (txt, x, y, size, fill = '#ffd23f') => {
  g.font = `${size}px Lilita`; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
  g.lineWidth = size * 0.2; g.strokeStyle = INK; g.strokeText(txt, x + size * 0.04, y + size * 0.07);
  g.strokeText(txt, x, y); g.fillStyle = fill; g.fillText(txt, x, y);
  g.save(); g.beginPath(); g.rect(0, y - size * 0.45, 1e5, size * 0.6); g.clip(); g.fillStyle = 'rgba(255,255,255,.18)'; g.fillText(txt, x, y); g.restore();
};
if (which === 'avatar') {
  cv.width = cv.height = 800;
  sky(800, 800, '#3e7fd2', '#9cc3ee');
  // sun rays
  g.save(); g.translate(400, 430); for (let i = 0; i < 16; i++) { g.rotate(Math.PI / 8); g.beginPath(); g.moveTo(0, 0); g.lineTo(600, -80); g.lineTo(600, 80); g.fillStyle = i % 2 ? 'rgba(255,255,255,.10)' : 'rgba(255,255,255,0)'; g.fill(); } g.restore();
  card(p => T.minerFront(p, 'you', { expr: 'smile', look: 0.2, L: 'hang', R: 'hang' }), 400, 1440, 1.45);
  card(p => T.canaryCage(p, { cage: false, perch: false, beak: 0.6, proud: true, puff: 1, look: -0.3 }), 268, 498, 0.55);
} else {
  cv.width = 2560; cv.height = 1440;
  sky(2560, 1440);
  cloud(560, 330, 70); cloud(2050, 290, 60); cloud(1300, 180, 50); cloud(300, 1120, 60); cloud(2300, 1150, 55);
  hill(2560, 912, 22, 0.6, '#8fbf5a', 1440); hill(2560, 1040, 40, 2.2, '#6fa548', 1440);
  // characters, safe area x 507..2053, y 508..931
  const gy = 905, s = 0.40;
  card(p => T.romanFront(p, 'legion', { expr: 'smile', facing: 1 }), 770, gy, s);
  card(p => T.minerFront(p, 'you', { expr: 'smile', L: 'holdUp', items: { cage: { beak: 1, proud: true } } }), 900, gy, s);
  card(p => T.minerFront(p, 'foreman', { expr: 'puzzled', L: 'shrug', R: 'shrug', facing: -1 }), 1665, gy, s);
  card(p => T.romanFront(p, 'toga', { expr: 'laugh', facing: -1 }), 1790, gy, s);
  title(NAME, 1283, 740, 108);
  g.font = '42px Lilita'; g.textAlign = 'center'; g.lineWidth = 11; g.strokeStyle = INK; g.strokeText(TAG, 1283, 818); g.fillStyle = '#fff'; g.fillText(TAG, 1283, 818);
}
window.ready = true;
</script></body></html>
