<script>
const CFG=window.CFG||{title:'И',artist:'сингл · 2026',pill:'звук на максимум',dur:56.66};
const A=window.AUDIO;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,p)=>a+(b-a)*p;
const eo=p=>1-Math.pow(1-clamp(p),3),eio=p=>{p=clamp(p);return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
const spr=p=>p<=0?0:1-Math.exp(-5.2*p)*Math.cos(9.5*p);
const back=p=>{p=clamp(p);const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const ph=(t,t0,d)=>clamp((t-t0)/d);
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const B=A.beats;
const sample=(arr,t,fps)=>{const x=t*fps;const i=Math.floor(x);const a=arr[clamp(i,0,arr.length-1)],b=arr[clamp(i+1,0,arr.length-1)];return a+(b-a)*(x-i)};
const rmsAt=t=>sample(A.rms,t,120),bassAt=t=>sample(A.bass,t,120);
const smooth=(fn,t,w=.12)=>{let s=0;for(let i=0;i<6;i++)s+=fn(Math.max(0,t-w*i/5));return s/6};
const specAt=(t,i)=>{const x=t*60;const k=clamp(Math.floor(x),0,A.spec.length-1);return A.spec[k][i]};
const envL=(list,t,k,th=0)=>{let e=0;for(const [kt,s] of list){if(kt>t)break;if(s<th)continue;const d=t-kt;if(d<1.2)e+=s*Math.exp(-d*k)}return Math.min(e,1.3)};
const beatEnv=(t,k=9)=>{let e=0;for(let i=0;i<B.length;i++){const d=t-B[i];if(d<0)break;if(d<1){const w=((i-1)%8==0)?1:((i-1)%2==0?.6:.4);e=Math.max(e,w*Math.exp(-d*k))}}return e};
const lastBeat=t=>{let j=-1;for(let i=0;i<B.length;i++)if(B[i]<=t)j=i;return j};
const countIn=(list,t0,t,th)=>list.filter(([a,s])=>a>=t0&&a<=t&&s>=th).length;
const $=id=>document.getElementById(id);
function pop(e,t,t0,amt=1){const p=(t-t0)/.3;if(p<0){e.style.opacity=0;e.style.transform='scale(.4)';return}
 e.style.opacity=clamp(p*3);const s=p>=1?1:lerp(.4,1,back(p));e.style.transform=`scale(${s})`}
function kick(e,t,t0,amt=.3,k=8){return t>=t0?1+amt*Math.exp(-(t-t0)*k):1}

const G={
 spk:'<path fill="#fff" d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>',
 eq:'<rect x="4" y="10" width="3" height="10" rx="1.5" fill="#fff"/><rect x="10.5" y="4" width="3" height="16" rx="1.5" fill="#fff"/><rect x="17" y="8" width="3" height="12" rx="1.5" fill="#fff"/>',
 heart:'<path fill="#fff" d="M12 21s-8.5-5.4-8.5-11.3A4.7 4.7 0 0112 7a4.7 4.7 0 018.5 2.7C20.5 15.6 12 21 12 21z"/>',
 gauge:'<path d="M4 17a8 8 0 1116 0" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M12 17l4-6" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>',
 plane:'<path fill="#fff" d="M21 15v-2l-8-5V3.5a1.5 1.5 0 00-3 0V8l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-5.5z"/>',
 bolt:'<path fill="#fff" d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
 cloud:'<path fill="#fff" d="M7 18a4.5 4.5 0 01-.6-9A6 6 0 0118 9a4.5 4.5 0 01-.5 9z"/>',
 timer:'<circle cx="12" cy="13" r="8" stroke="#fff" stroke-width="2.4" fill="none"/><path d="M12 13V8.5M10 2.5h4" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>',
 slider:'<path d="M5 4v16M12 4v16M19 4v16" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="5" cy="14" r="2.6" fill="#fff"/><circle cx="12" cy="8" r="2.6" fill="#fff"/><circle cx="19" cy="16" r="2.6" fill="#fff"/>',
 grid:'<rect x="3" y="3" width="8" height="8" rx="2" fill="#fff"/><rect x="13" y="3" width="8" height="8" rx="2" fill="#fff"/><rect x="3" y="13" width="8" height="8" rx="2" fill="#fff"/><rect x="13" y="13" width="8" height="8" rx="2" fill="#fff" opacity=".6"/>',
 disc:'<circle cx="12" cy="12" r="9" fill="#fff"/><circle cx="12" cy="12" r="2.5" fill="#333"/>',
 therm:'<path fill="#fff" d="M10 4a2 2 0 014 0v9.5a4.5 4.5 0 11-4 0z"/>',
 rocket:'<path fill="#fff" d="M12 2c3 2.5 4.5 6 4.5 10l2.5 3v4l-4-2h-6l-4 2v-4l2.5-3C7.5 8 9 4.5 12 2z"/><circle cx="12" cy="10" r="1.8" fill="#5856D6"/>',

 seis:'<path d="M2 12h4l2-6 3 12 3-9 2 5 2-2h4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linejoin="round"/>',
 star:'<path fill="#fff" d="M12 2l3 6.6 7 .7-5.3 4.8 1.6 7L12 17.6 5.7 21l1.6-7L2 9.3l7-.7z"/>',
 ring:'<circle cx="12" cy="12" r="8" stroke="#fff" stroke-width="3" fill="none" stroke-dasharray="30 60"/>',
 music:'<path d="M9 18V5l11-2v13" stroke="#fff" stroke-width="2.4" fill="none"/><circle cx="6.5" cy="18" r="3" fill="#fff"/><circle cx="17.5" cy="16" r="3" fill="#fff"/>',
 count:'<circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="2.4" fill="none"/><path d="M10 8h4l-3 8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>',
};
const ico=(g,c,sz=40)=>`<div class="ico" style="background:${c};width:${sz}px;height:${sz}px"><svg viewBox="0 0 24 24">${G[g]}</svg></div>`;
const hdr=(g,c,t,s,dk)=>`<div class="hdr${dk?' dk':''}">${ico(g,c)}<div><div class="ht">${t}</div><div class="hs">${s}</div></div></div>`;
const HEART=(c,sz)=>`<svg viewBox="0 0 24 24" width="${sz}" height="${sz}"><path fill="${c}" d="M12 21s-8.5-5.4-8.5-11.3A4.7 4.7 0 0112 7a4.7 4.7 0 018.5 2.7C20.5 15.6 12 21 12 21z"/></svg>`;
const rep=(n,f)=>Array.from({length:n},(_,i)=>f(i)).join('');

// ================= CARDS =================
const CARDS=[
{t0:1.51,enter:'zoom',bg:'linear-gradient(160deg,#fff 45%,#f1e6ff)',
 html:hdr('spk','#AF52DE','Звук','Громкость на максимум')+
 `<div class="abs" style="left:60px;top:90px;width:280px;height:280px">${rep(4,i=>`<div class="abs" data-k="r${i}" style="left:0;top:0;width:280px;height:280px;border-radius:50%;border:3px solid #AF52DE"></div>`)}
  <div class="abs" data-k="c1" style="left:30px;top:30px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#3a2850 0 22%,#251a35 23% 52%,#4a3366 53% 56%,#251a35 57% 100%);box-shadow:0 14px 30px rgba(60,20,90,.35)"></div>
  <div class="abs" data-k="c2" style="left:110px;top:110px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9b8ff,#7d3fd1)"></div></div>
  <div class="abs lbl" style="left:390px;top:120px">Уровень</div><div class="abs big" data-k="db" style="left:386px;top:138px;font-size:64px">0 dB</div>
  <div class="chip" data-k="mx" style="left:392px;top:236px;background:#AF52DE;font-size:16px">МАКС ▲</div>`,
 up(c,lt,t){const b=smooth(bassAt,t);c.k.c1.style.transform=`scale(${.92+.14*b})`;c.k.c2.style.transform=`scale(${.85+.4*b})`;
  for(let i=0;i<4;i++){const r=((lt*1.42)+i/4)%1;c.k['r'+i].style.transform=`scale(${.75+r*.55})`;c.k['r'+i].style.opacity=(1-r)*.8}
  c.k.db.textContent=(Math.round(-18+18*clamp(rmsAt(t)))||0)+' dB';pop(c.k.mx,t,2.93)}},
{t0:3.65,enter:'swing',bg:'linear-gradient(170deg,#1b1530,#2e1f4f)',dk:1,
 html:hdr('eq','#FF2D55','Эквалайзер','16 полос',1)+
 `<div class="abs" style="left:28px;bottom:34px;width:584px;height:260px;display:flex;gap:6px;align-items:flex-end">${rep(16,i=>`<div style="flex:1;height:100%;position:relative"><i data-k="b${i}" style="position:absolute;bottom:0;left:0;right:0;border-radius:7px;background:linear-gradient(#ff8fc7,#8b5cf6)"></i><i data-k="p${i}" style="position:absolute;left:0;right:0;height:5px;border-radius:3px;background:#fff"></i></div>`)}</div>`,
 up(c,lt,t){for(let i=0;i<16;i++){const v=specAt(t,i);c.k['b'+i].style.height=(8+250*v*v)+'px';let pk=0;for(let j=0;j<24;j++){const dt=j/60;pk=Math.max(pk,specAt(t-dt,i)**2-dt*1.4)}c.k['p'+i].style.bottom=(14+250*pk)+'px'}}},
{t0:6.46,enter:'drop',bg:'#fff',notif:{g:'heart',c:'#FF3B30',t:'Здоровье',s:'Пульс подстроился под бит'},
 html:hdr('heart','#FF3B30','Пульс','Сердце бьётся в такт')+
 `<svg class="abs" style="left:0;top:110px" width="640" height="220"><defs><linearGradient id="ecg" x1="0" x2="1"><stop offset="0" stop-color="#ff3b30" stop-opacity="0"/><stop offset=".8" stop-color="#ff3b30"/></linearGradient></defs>
  ${rep(5,i=>`<line x1="0" x2="640" y1="${20+i*45}" y2="${20+i*45}" stroke="#f3e3e3"/>`)}<path data-k="pl" stroke="url(#ecg)" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle data-k="dot" r="8" fill="#ff3b30"/></svg>
  <div class="abs" data-k="hh" style="left:430px;top:24px">${HEART('#ff3b30',56)}</div>
  <div class="abs big" style="left:500px;top:26px;font-size:42px" data-k="bpm">85</div><div class="abs lbl" style="left:503px;top:76px">уд/мин</div>`,
 up(c,lt,t){let d='';const N=90;for(let i=0;i<=N;i++){const tt=t-2.6+2.6*i/N;let y=110;for(const b of B){const x=(tt-b)/.06;if(Math.abs(x)<3){y-=Math.exp(-x*x)*95*(x<0?1:-.45)}}y+=Math.sin(tt*30)*2;d+=(i?'L':'M')+(i*600/N+10)+' '+y}
  c.k.pl.setAttribute('d',d);const le=d.split(/[ML]/).pop().split(' ');c.k.dot.setAttribute('cx',le[0]);c.k.dot.setAttribute('cy',le[1]);
  c.k.hh.style.transform=`scale(${1+.3*beatEnv(t,10)})`;c.k.bpm.textContent=Math.round(84+2*Math.sin(t*2))}},
{t0:9.29,enter:'spin',bg:'linear-gradient(160deg,#fff,#fff1e3)',
 html:hdr('gauge','#FF9500','Спидометр','Разгон по бас-линии')+
 `<svg class="abs" style="left:110px;top:90px" width="420" height="300" viewBox="0 0 420 300"><path d="M50 250A160 160 0 11370 250" stroke="#f2e5d8" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path data-k="arc" d="M50 250A160 160 0 11370 250" stroke="url(#sg2)" stroke-width="26" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
  <defs><linearGradient id="sg2"><stop offset="0" stop-color="#ffcc00"/><stop offset="1" stop-color="#ff3b30"/></linearGradient></defs>
  ${rep(11,i=>{const a=(-210+24*i)*Math.PI/180;return `<line x1="${210+Math.cos(a)*120}" y1="${210+Math.sin(a)*120}" x2="${210+Math.cos(a)*135}" y2="${210+Math.sin(a)*135}" stroke="#c9b9a8" stroke-width="4" stroke-linecap="round"/>`})}
  <g data-k="nd"><path d="M210 210L210 80" stroke="#111" stroke-width="7" stroke-linecap="round"/></g><circle cx="210" cy="210" r="16" fill="#111"/></svg>
  <div class="abs big" data-k="sp" style="left:0;width:640px;text-align:center;top:300px;font-size:54px">0</div><div class="abs lbl" style="left:0;width:640px;text-align:center;top:360px">км/ч</div>`,
