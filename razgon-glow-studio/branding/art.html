<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
// Channel art for "Hour by Hour": ?kind=banner (2560×1440) | avatar (800×800)
import { E, setStyle, circle, ring, seg, rr, glow, alpha, text, linGrad, radGrad, rng, measure } from '/engine/core.js';
import { drawGlow, bigGlow, eyes } from '/engine/glow.js';
const kind = new URLSearchParams(location.search).get('kind') || 'banner';
setStyle('vivid'); Object.assign(E, { W: 1920, H: 1080 });
for (const [fam, w, f] of [['Montserrat', '800', 'montserrat/files/montserrat-latin-800-normal.woff2'], ['Montserrat', '700', 'montserrat/files/montserrat-latin-700-normal.woff2'], ['Caveat', '700', 'caveat/files/caveat-latin-700-normal.woff2']]) { const ff = new FontFace(fam, `url(/node_modules/@fontsource/${f})`, { weight: w }); await ff.load(); document.fonts.add(ff); }
const c = document.getElementById('c'), g = c.getContext('2d');
const TEAL = '#69b39e', CREAM = '#fff6e8', GOLD = '#ffad45';

// glowing clock: face of soft light, 12 dots, hands at 7:12 (the moment it all starts)
function clock(cx, cy, r, a = 1, H = 7, Mi = 12) {
  g.save(); g.globalAlpha = a;
  glow(g, cx, cy, r * 2.2, '#ffd59a', 0.35);
  circle(g, cx, cy, r, alpha('#1c1f3e', 0.85)); ring(g, cx, cy, r, r * 0.06, alpha(CREAM, 0.9));
  for (let i = 0; i < 12; i++) { const an = i / 12 * Math.PI * 2; circle(g, cx + Math.sin(an) * r * 0.8, cy - Math.cos(an) * r * 0.8, r * (i % 3 ? 0.03 : 0.055), alpha(CREAM, i % 3 ? 0.6 : 1)); }
  const hh = (H + Mi / 60) / 12 * Math.PI * 2, mm = Mi / 60 * Math.PI * 2;
  seg(g, [[cx, cy], [cx + Math.sin(hh) * r * 0.48, cy - Math.cos(hh) * r * 0.48]], r * 0.075, CREAM);
  seg(g, [[cx, cy], [cx + Math.sin(mm) * r * 0.7, cy - Math.cos(mm) * r * 0.7]], r * 0.045, GOLD);
  circle(g, cx, cy, r * 0.06, GOLD); g.restore();
}
function stars(w, h, n, seed) { const R = rng(seed); for (let i = 0; i < n; i++) { const x = R() * w, y = R() * h, s = 1 + R() * 2.5; circle(g, x, y, s, alpha('#ffffff', 0.15 + R() * 0.45)); } }

if (kind === 'banner') {
  c.width = 2560; c.height = 1440;
  // night-to-dawn gradient: a whole day in one strip
  g.fillStyle = linGrad(g, 0, 0, 2560, 0, ['#141a46', '#2a2470', '#5a2f8a', '#c0567a', '#f2a066']); g.fillRect(0, 0, 2560, 1440);
  g.fillStyle = linGrad(g, 0, 0, 0, 1440, [alpha('#000', 0.25), alpha('#000', 0), alpha('#000', 0.3)]); g.fillRect(0, 0, 2560, 1440);
  stars(1100, 1440, 140, 3);
  // faint hour track across the banner (the day line), with hour ticks
  const ty = 860; seg(g, [[0, ty], [2560, ty]], 3, alpha(CREAM, 0.18));
  for (let i = 0; i <= 24; i++) { const x = 60 + i * 102; seg(g, [[x, ty - (i % 6 ? 10 : 22)], [x, ty + (i % 6 ? 10 : 22)]], 3, alpha(CREAM, i % 6 ? 0.2 : 0.4)); }
  // safe area (all devices): x 507..2053, y 508..931  → keep text + key art inside
  // left: the invisible person — glowing outline with white eyes
  g.save(); g.translate(0, 0); drawGlow(g, { x: 760, y: 905, s: 1.35, facing: 1, turn: 0.15, outfit: { top: 'hoodie', color: TEAL }, invisible: 0.95, edgeColor: '#eaf6ff', expr: 'open', look: [0.6, -0.1], pose: { aF: [0.5, 1.9], aB: [-0.15, 0.1], lF: [0.02, 0], lB: [-0.02, 0], lean: 0, hx: 0, hy: 0, ht: 0 }, rim: { color: '#eaf6ff', dir: [0.6, -0.8] } }); g.restore();
  glow(g, 760, 720, 260, '#bfe0ff', 0.18);
  // title with the clock as the "O" of HOUR
  const tx = 1000, tyT = 690, size = 150;
  const part1 = 'H', part2 = 'UR BY H', part3 = 'UR';
  let x = tx; const sp = 8;
  const put = (s) => { text(g, s, x, tyT, { size, font: 'Montserrat', weight: 800, color: CREAM, align: 'left', spacing: sp, glow: 30, glowColor: 'rgba(0,0,0,.35)' }); x += measure(g, s, size, 'Montserrat', 800) + s.length * sp; };
  const O = () => { clock(x + size * 0.42, tyT - 4, size * 0.42); x += size * 0.84 + sp * 2; };
  put(part1); O(); put(part2); O(); put(part3);
  text(g, 'one impossible day at a time', tx + 6, tyT + 128, { size: 64, font: 'Caveat', weight: 700, color: GOLD, align: 'left' });
  // little sun rising on the right edge of the day line (dawn after the night)
  glow(g, 2380, ty, 260, '#ffd59a', 0.55); circle(g, 2380, ty, 46, '#fff2c8');
} else {
  c.width = 800; c.height = 800; Object.assign(E, { W: 800, H: 800 });
  g.fillStyle = radGrad(g, 400, 320, 40, 560, ['#3a2f86', '#1a1c48']); g.fillRect(0, 0, 800, 800);
  stars(800, 420, 30, 7);
  // the clock as a halo behind the head, hands near midnight (where every story ends)
  clock(400, 300, 235, 0.97, 11, 55);
  // the character: black head, white eyes, teal hoodie, cream rim light
  bigGlow(g, 400, 545, 128, { outfit: { top: 'hoodie', color: TEAL }, expr: 'open', look: [0.3, -0.6], turn: 0.1, rim: { color: '#fff2d8' }, rimSide: -1 });
}
window.DONE = true;
</script></body></html>
