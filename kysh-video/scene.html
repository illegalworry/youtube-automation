<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;background:#0a0c1c;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#1a1f45 0%,#0d1029 55%,#070816 100%)}
#aur{position:absolute;inset:-100px;filter:blur(90px);opacity:.9}

canvas.full{position:absolute;inset:0;width:720px;height:1280px}

#top{position:absolute;left:36px;top:44px;display:flex;align-items:center;gap:10px;font-size:19px;color:#fff;font-weight:800;white-space:nowrap}
#top span{color:#a7a3c9;font-weight:500}
#bars{display:flex;gap:3px;align-items:flex-end;height:18px}#bars i{display:block;width:4px;border-radius:1px;background:#a7a3c9}
#stage{position:absolute;inset:0;perspective:1400px;perspective-origin:360px 520px}
.card{position:absolute;left:36px;top:250px;width:648px;height:570px;border-radius:38px;background:linear-gradient(#1b1d2c,#14151f);display:none;
 box-shadow:0 0 0 1.5px rgba(255,255,255,.07) inset}
.glow{position:absolute;inset:-26px;border-radius:60px;filter:blur(30px);opacity:.55;z-index:-1}
.hdr{position:absolute;left:24px;top:22px;display:flex;align-items:center;gap:13px}
.ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px}
.ht{font-weight:800;font-size:22px;color:#fff;line-height:1.1}
.hs{font-size:15px;color:#9c9ab3;margin-top:3px;font-weight:500}
.cor{position:absolute;right:24px;top:22px;font-size:30px}
.scn{position:absolute;left:18px;top:94px;width:612px;height:458px;border-radius:24px;overflow:hidden}
.scn svg{position:absolute;inset:0}
.chip{position:absolute;padding:7px 14px;border-radius:20px;font-size:15px;font-weight:800;color:#fff;white-space:nowrap;background:rgba(10,12,30,.62);border:1.5px solid rgba(255,255,255,.35);backdrop-filter:blur(4px)}
#sub{position:absolute;left:30px;right:30px;top:858px;text-align:center}
#ky{font-size:29px;font-weight:800;line-height:1.22;color:rgba(255,255,255,.28)}

#ru{margin-top:12px;font-size:20px;font-weight:600;color:#b9b2f0;line-height:1.3}
#bar{position:absolute;left:96px;top:1046px;width:528px;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}
#barf{height:100%;border-radius:3px;background:linear-gradient(90deg,#d7d3ff,#fff)}
#t0,#t1{position:absolute;top:1064px;font-size:15px;color:#8f8ba8;font-weight:600}#t0{left:96px}#t1{right:96px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:80;pointer-events:none}
#warm{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(255,140,60,.45),transparent 70%);mix-blend-mode:screen;opacity:0;z-index:70;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.55));z-index:71;pointer-events:none}
#intro{position:absolute;inset:0;z-index:60}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
 <filter id="b0" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="bg0" stdDeviation="0"/></filter>
 <filter id="b1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="bg1" stdDeviation="0"/></filter>
 <radialGradient id="gw"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <radialGradient id="gy"><stop offset="0" stop-color="#ffd27a" stop-opacity=".95"/><stop offset=".4" stop-color="#ffb347" stop-opacity=".45"/><stop offset="1" stop-color="#ff8a00" stop-opacity="0"/></radialGradient>
 <radialGradient id="go"><stop offset="0" stop-color="#ff9a3c" stop-opacity=".9"/><stop offset="1" stop-color="#ff4d00" stop-opacity="0"/></radialGradient>
 <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4b86"/><stop offset="1" stop-color="#26305c"/></linearGradient>
 <linearGradient id="nightsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1233"/><stop offset="1" stop-color="#27306a"/></linearGradient>
 <linearGradient id="snowg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3ff"/><stop offset="1" stop-color="#b9c6ec"/></linearGradient>
</defs></svg>
<div id="bg"></div><div id="aur"><div></div><div></div><div></div></div>
<canvas class="full" id="stars" width="1080" height="1920"></canvas>
<div id="world">
 <div id="top"><div id="bars"><i></i><i></i><i></i><i></i></div>И</div>
 <div id="stage"></div>
 <div id="sub"><div id="ky"></div><div id="ru"></div></div>
 <div id="bar"><div id="barf"></div></div><div id="t0"></div><div id="t1"></div>
 <div id="intro"></div>
</div>
<canvas class="full" id="snow" width="1080" height="1920" style="z-index:65"></canvas>
<div id="warm"></div><div id="vig"></div><div id="flash"></div>
<script>
const A=window.AUDIO,B=A.beats,DUR=56.66;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,p)=>a+(b-a)*p,ph=(t,t0,d)=>clamp((t-t0)/d);
const eo=p=>1-Math.pow(1-clamp(p),3),eio=p=>{p=clamp(p);return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
const spr=p=>p<=0?0:1-Math.exp(-5*p)*Math.cos(9*p);
const back=p=>{p=clamp(p);const c=2;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
function rnd(s){s>>>=0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const smp=(a,t,f)=>{const x=t*f,i=Math.floor(x),u=a[clamp(i,0,a.length-1)],v=a[clamp(i+1,0,a.length-1)];return u+(v-u)*(x-i)};
const rms=t=>smp(A.rms,t,120),bass=t=>smp(A.bass,t,120);
const beatE=(t,k=9)=>{let e=0;for(let i=0;i<B.length;i++){const d=t-B[i];if(d<0)break;if(d<1){const w=((i-1)%4==0)?1:.55;e=Math.max(e,w*Math.exp(-d*k))}}return e};
const lastB=t=>{let j=-1;for(let i=0;i<B.length;i++)if(B[i]<=t)j=i;return j};
const kickE=(t,k=10,th=.5)=>{let e=0;for(const[a,s]of A.kicks){if(a>t)break;if(s<th)continue;const d=t-a;if(d<1)e+=s*Math.exp(-d*k)}return Math.min(e,1.2)};
const $=id=>document.getElementById(id);
const g=(x,y,r,s,inner,extra='')=>`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(r||0).toFixed(2)}) scale(${s||1})" ${extra}>${inner}</g>`;
const popS=(t,t0,d=.35)=>t<t0?0:(t-t0>=d?1:back((t-t0)/d));

// ---------- characters ----------
function hero(o){o=Object.assign({x:0,y:0,s:1,bob:0,aL:20,aR:-20,lL:0,lR:0,tilt:0,mouth:'smile',eyes:'open',brow:0,look:0,phones:0,scarf:0,blush:1,mittL:'',mittR:'',lean:0,shiver:0},o);
 const sk='#f3c8a2',lim=(rot,len,w,col,end)=>`<g transform="rotate(${rot})"><rect x="${-w/2}" y="0" width="${w}" height="${len}" rx="${w/2}" fill="${col}"/>${end}</g>`;
 const legs=`<g transform="translate(-13 -60)">${lim(o.lL,52,17,'#1d2240',`<ellipse cx="2" cy="52" rx="13" ry="8" fill="#0f1226"/>`)}</g><g transform="translate(13 -60)">${lim(o.lR,52,17,'#1d2240',`<ellipse cx="-2" cy="52" rx="13" ry="8" fill="#0f1226"/>`)}</g>`;
 const arm=(side,rot)=>`<g transform="translate(${side*31} -108) rotate(${side*rot})">${lim(0,48,16,'#33417a',`<circle cx="0" cy="50" r="10" fill="#d8323f"/>`+(side<0?o.mittL:o.mittR))}</g>`;
 const body=`<rect x="-34" y="-124" width="68" height="74" rx="26" fill="url(#coat)"/><path d="M-30 -100h60M-32 -80h64" stroke="#5065ad" stroke-width="2" opacity=".6"/><rect x="-2" y="-118" width="4" height="64" fill="#1e2650" opacity=".7"/>`;
 const sc=o.scarf;const scarf=`<rect x="-30" y="-130" width="60" height="16" rx="8" fill="#e23b4a"/><path d="M14 -120 q${8+sc*6} ${16} ${4+sc*14} ${36} l-13 2 q2 -18 -4 -34z" fill="#c42a39"/>`;
 const ey=o.eyes;const eyeF=x=>ey=='closed'?`<path d="M${x-7} -158 q7 6 14 0" stroke="#2a1a14" stroke-width="3" fill="none" stroke-linecap="round"/>`:ey=='happy'?`<path d="M${x-7} -156 q7 -8 14 0" stroke="#2a1a14" stroke-width="3.2" fill="none" stroke-linecap="round"/>`:
  `<ellipse cx="${x+o.look*3}" cy="-157" rx="5.5" ry="${ey=='wide'?8:7}" fill="#2a1a14"/><circle cx="${x+o.look*3+2}" cy="-159.5" r="2" fill="#fff"/>`;
 const br=o.brow;const brows=`<path d="M-21 ${-170+br*2} l14 ${br*6-1}" stroke="#3a2418" stroke-width="3.4" stroke-linecap="round"/><path d="M21 ${-170+br*2} l-14 ${br*6-1}" stroke="#3a2418" stroke-width="3.4" stroke-linecap="round"/>`;
 const m=o.mouth;const mouth=m=='smile'?`<path d="M-9 -142 q9 9 18 0" stroke="#7a2e22" stroke-width="3.2" fill="none" stroke-linecap="round"/>`:m=='grin'?`<path d="M-11 -144 q11 14 22 0z" fill="#7a2e22"/>`:m=='frown'?`<path d="M-8 -138 q8 -7 16 0" stroke="#7a2e22" stroke-width="3.2" fill="none" stroke-linecap="round"/>`:m=='o'?`<ellipse cx="0" cy="-141" rx="5" ry="6.5" fill="#7a2e22"/>`:`<path d="M-7 -141 h14" stroke="#7a2e22" stroke-width="3.2" stroke-linecap="round"/>`;
 const kalpak=`<path d="M-37 -183 Q-30 -238 0 -246 Q30 -238 37 -183 Z" fill="#f4f1ea"/><path d="M-22 -200 q22 -10 44 0 M-14 -222 q14 -6 28 0" stroke="#c9c2b4" stroke-width="2" fill="none"/><path d="M-40 -186 L-36 -173 L36 -173 L40 -186 L18 -190 L0 -186 L-18 -190 Z" fill="#1b1b22"/><circle cx="0" cy="-247" r="4" fill="#c42a39"/>`;
 const phones=o.phones?`<path d="M-38 -165 q0 -50 38 -52 q38 2 38 52" stroke="#22253a" stroke-width="7" fill="none"/><rect x="-46" y="-172" width="15" height="26" rx="7" fill="#ff4f7a"/><rect x="31" y="-172" width="15" height="26" rx="7" fill="#ff4f7a"/>`:'';
 const head=`<g transform="translate(0 ${o.bob*.4}) rotate(${o.tilt} 0 -150)"><circle cx="0" cy="-152" r="35" fill="${sk}"/>${o.blush?`<ellipse cx="-19" cy="-143" rx="7" ry="4.5" fill="#ff8f8f" opacity=".55"/><ellipse cx="19" cy="-143" rx="7" ry="4.5" fill="#ff8f8f" opacity=".55"/>`:''}${eyeF(-12)}${eyeF(12)}${brows}${mouth}${kalpak}${phones}</g>`;
 const sh=o.shiver?Math.sin(T_*80)*o.shiver*2:0;
 return g(o.x+sh,o.y,o.lean,o.s,`<ellipse cx="0" cy="2" rx="40" ry="8" fill="#000" opacity=".25"/><g transform="translate(0 ${o.bob})">${legs}${arm(-1,o.aL)}${body}${arm(1,o.aR)}${scarf}${head}</g>`);
}
function snowman(o){o=Object.assign({x:0,y:0,s:1,bob:0,aL:30,aR:-30,tilt:0,happy:1},o);
 const arm=(side,r)=>`<g transform="translate(${side*24} -78) rotate(${side*(60+r)})"><path d="M0 0 L0 46 M0 30 l${side*-8} 10" stroke="#6b4a2e" stroke-width="4" stroke-linecap="round"/></g>`;
 return g(o.x,o.y,0,o.s,`<ellipse cx="0" cy="2" rx="42" ry="8" fill="#000" opacity=".25"/><g transform="translate(0 ${o.bob})"><circle cx="0" cy="-36" r="38" fill="url(#snowg)"/><circle cx="0" cy="-98" r="29" fill="url(#snowg)"/>${arm(-1,o.aL)}${arm(1,o.aR)}<circle cx="0" cy="-90" r="3" fill="#333"/><circle cx="0" cy="-104" r="3" fill="#333"/>
  <g transform="rotate(${o.tilt} 0 -140)"><circle cx="0" cy="-148" r="24" fill="url(#snowg)"/><circle cx="-8" cy="-152" r="3.6" fill="#1a1a2a"/><circle cx="8" cy="-152" r="3.6" fill="#1a1a2a"/><path d="M0 -146 l18 4 l-18 3z" fill="#ff8a1e"/>
  <path d="${o.happy?'M-8 -138 q8 7 16 0':'M-8 -136 q8 -5 16 0'}" stroke="#333" stroke-width="2.6" fill="none" stroke-linecap="round"/><rect x="-20" y="-178" width="40" height="8" rx="3" fill="#2a2d44"/><rect x="-13" y="-200" width="26" height="24" rx="4" fill="#2a2d44"/><rect x="-13" y="-182" width="26" height="5" fill="#e23b4a"/></g>
  <path d="M-24 -122 h48 v10 h-48z" fill="#4f8cff"/><path d="M14 -116 l6 26 l-10 1z" fill="#3c6fd8"/></g>`)}
function person(x,y,s,c,ph){return g(x,y,0,s,`<g transform="translate(0 ${Math.abs(Math.sin(ph))*-4})"><rect x="-9" y="-40" width="7" height="${24}" rx="3.5" fill="#141833" transform="rotate(${Math.sin(ph)*25} -5 -40)"/><rect x="2" y="-40" width="7" height="24" rx="3.5" fill="#141833" transform="rotate(${-Math.sin(ph)*25} 5 -40)"/><rect x="-13" y="-78" width="26" height="42" rx="11" fill="${c}"/><circle cx="0" cy="-90" r="12" fill="#e9be97"/><path d="M-13 -94 q13 -16 26 0" fill="#2b2b3a"/></g>`)}
function snowGround(w,h,y,c='#dfe7ff'){return `<path d="M0 ${y} Q ${w*.25} ${y-14} ${w*.5} ${y} T ${w} ${y} V ${h} H 0Z" fill="${c}"/>`}
function starsSvg(n,seed,t,h=300){const R=rnd(seed);let s='';for(let i=0;i<n;i++){const x=R()*612,y=R()*h,r=.6+R()*1.6,tw=.4+.6*Math.abs(Math.sin(t*(1+R()*2)+R()*6));s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${tw}"/>`}return s}
function flakes(n,seed,t,sp=40,h=458){const R=rnd(seed);let s='';for(let i=0;i<n;i++){const x=R()*612,r=1.2+R()*2.6,v=sp*(.5+R()),y=((R()*h+t*v)%(h+20))-10;s+=`<circle cx="${(x+Math.sin(t*1.3+i)*8).toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="#fff" opacity="${.5+R()*.5}"/>`}return s}
const mnt=(y,c,seed,amp=60)=>{const R=rnd(seed);let d=`M0 458 L0 ${y}`;for(let x=0;x<=612;x+=51){d+=` L${x} ${y-R()*amp}`}return `<path d="${d} L612 458Z" fill="${c}"/>`};
const sky=(c1,c2)=>`<rect width="612" height="458" fill="url(#sk_${c1.slice(1)}_${c2.slice(1)})"/><defs><linearGradient id="sk_${c1.slice(1)}_${c2.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>`;
let T_=0;

// ---------- lyrics ----------
const L=[
[0.70,'Бир аз эшик суук, бирок жүрөктө жылуу','На улице холодно, но в сердце тепло'],
[3.45,'Турамын карыз түндө мен, музыка угуп','Стою ночью и слушаю музыку'],
[6.25,'Элдерди карасам баары шашылат','Смотрю на людей — все спешат'],
[9.05,'Карысы да, жашы да, жана тайгаланган машина','И старый, и малый, и машины на льду'],
[11.90,'Бул кыш мезгил, Африкада күтпөгөн','Это зима — в Африке такую не ждут'],
[14.70,'Жылмаюуну алыстатып, кабактарды бүркөгөн','Прогоняет улыбки, хмурит брови'],
[17.50,'Карапайым калкты кыйнап, убараны жүктөгөн','Мучает простой народ, грузит хлопотами'],
[20.30,'Музга айлантып айлананы','Всё вокруг превращает в лёд'],
[23.10,'Аны көзгө алба, бул да кайгыга салбайт','Не бери в голову — это не повод грустить'],
[25.55,'Ишембиге даярданып, досторуң менен камдан','Готовься к субботе, собирайся с друзьями'],
[28.35,'Салтка калган көнүгүү, лыжа менен өнүгүү','Добрая традиция — кататься на лыжах'],
[31.00,'Аппак болуп жердин бети — кыштын сыйкыр бөлүгү','Земля белым-бела — волшебство зимы'],
[34.20,'Эгер кар көп жааса, өзүң жалгыз калсаң','Если снега много и ты остался один'],
[37.50,'токтогонсуйт көмүрүң','будто гаснет твой уголёк'],
[39.62,'Жылытсын музыкам жанды, жүгүртүп тамырдан канды','Пусть моя музыка согреет душу и разгонит кровь'],
[42.85,'Чыдап кой сен, бир аз калды, жаз да келет көрүнүп','Потерпи, осталось чуть-чуть — придёт весна'],
[45.24,'Жаңы жыл келсин!','Пусть придёт Новый год!'],
[47.90,'Жанып түнбөгөн…','Горящий, не гаснущий…'],
[50.60,'Жарык жүктөгөн, эмне?','Несущий свет — а как же!'],
];
L.forEach((l,i)=>{l[3]=i<L.length-1?L[i+1][0]-.15:54.6});

// ---------- scenes ----------
const SC=[
{t0:.81,c:'#ff6a7a',ico:'🌡️',ib:'#ff4d5e',h:'Погода',s:'снаружи холодно, в сердце тепло',cor:'❤️',draw(t,l){
 const he=beatE(t,7);let s=sky('#0b1030','#2a3470')+starsSvg(30,1,t)+mnt(330,'#1d2550',3,40)+snowGround(612,458,380)+flakes(40,2,t);
 s+=`<rect x="40" y="170" width="120" height="210" rx="10" fill="#3a2a2a"/><rect x="52" y="182" width="96" height="198" rx="6" fill="#ffb347" opacity=".9"/><circle cx="135" cy="290" r="5" fill="#5a3a1a"/>`;
 s+=`<g transform="translate(500 150)"><rect x="-16" y="0" width="32" height="170" rx="16" fill="#e8eeff" opacity=".9"/><circle cx="0" cy="182" r="26" fill="#4aa8ff"/><rect x="-7" y="${150-40*(1-ph(t,1.2,1))}" width="14" height="${40+40*(1-ph(t,1.2,1))}" rx="7" fill="#4aa8ff"/><text x="34" y="40" fill="#bfe0ff" font-size="22" font-weight="800">−12°</text></g>`;
 s+=hero({x:290,y:400,s:1.15,bob:Math.sin(t*2.2)*2,aL:15+Math.sin(t*3)*4,aR:-150+Math.sin(t*2)*6,mouth:'smile',eyes:t%3<.12?'closed':'open',shiver:.6,scarf:Math.sin(t*3)});
 const hs=1+.35*he;s+=g(290,265,0,hs,`<circle r="30" fill="url(#gy)"/><path d="M0 9 c-14 -10 -16 -22 -7 -26 c4 -2 7 1 7 4 c0 -3 3 -6 7 -4 c9 4 7 16 -7 26z" fill="#ff4d6d"/>`);
 return s+`<text x="306" y="64" text-anchor="middle" fill="#ffd2d8" font-size="20" font-weight="800" opacity="${ph(t,2.0,.3)}">+36,6° внутри</text>`}},
{t0:3.65,c:'#a07bff',ico:'🎧',ib:'#7c5cff',h:'Музыка',s:'стою ночью, слушаю',cor:'🎵',draw(t,l){
 let s=sky('#090b26','#231c55')+starsSvg(50,4,t)+mnt(360,'#191a44',5,50)+snowGround(612,458,400,'#cfd8f5')+flakes(30,6,t,30);
 s+=`<rect x="438" y="110" width="8" height="300" fill="#2c2f4a"/><path d="M442 112 q30 -12 50 6" stroke="#2c2f4a" stroke-width="7" fill="none"/><ellipse cx="492" cy="128" rx="18" ry="8" fill="#ffe7a6"/><path d="M474 130 L410 420 L580 420 Z" fill="url(#gy)" opacity=".35"/>`;
 const bE=beatE(t,8),j=lastB(t);s+=hero({x:300,y:420,s:1.2,phones:1,bob:-6*bE,tilt:(j%2?1:-1)*5*eo(clamp((t-B[Math.max(0,j)])/.3)),eyes:'closed',mouth:'smile',aL:12+8*bE,aR:-12-8*bE,lL:3*bE,lR:-3*bE});
