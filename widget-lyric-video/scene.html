<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:720px;overflow:hidden;background:#ece6f4;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:-120px;filter:blur(70px)}
.blob{position:absolute;border-radius:50%;width:520px;height:520px}
#world{position:absolute;inset:0;transform-origin:360px 330px}
#spark{position:absolute;inset:0;width:720px;height:720px}
#stage{position:absolute;left:0;top:0;width:720px;height:720px;perspective:1100px;perspective-origin:360px 330px}
.card{position:absolute;left:105px;top:180px;width:510px;height:300px;border-radius:30px;background:#fff;overflow:hidden;
 box-shadow:0 30px 60px -18px rgba(90,60,140,.35),0 6px 18px rgba(90,60,140,.12);display:none;backface-visibility:hidden;will-change:transform}
.hdr{position:absolute;left:20px;top:18px;display:flex;align-items:center;gap:10px;z-index:5}
.ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.ico svg{width:19px;height:19px}
.ht{font-weight:700;font-size:17px;color:#111;line-height:1.05}
.hs{font-size:11.5px;color:#8a8a90;margin-top:2px;font-weight:500}
.abs{position:absolute}
.lbl{font-size:11px;color:#8e8e93;font-weight:600}
.chip{position:absolute;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
#island{position:absolute;left:50%;top:16px;background:#000;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.18)}
#island .m{position:absolute;inset:0;display:flex;align-items:center;padding:0 14px;gap:11px}
#island .tt{color:#fff;font-weight:700;font-size:15px;line-height:1.1;white-space:nowrap}
#island .ts{color:#9a9aa0;font-size:12px;font-weight:500;white-space:nowrap}
#eq{margin-left:auto;display:flex;gap:3px;align-items:center;height:28px}
#eq i{display:block;width:4px;border-radius:2px;background:linear-gradient(#f39ad8,#b46cf0)}
#ui{position:absolute;inset:0}
#dots{position:absolute;top:513px;left:0;width:720px;display:flex;justify-content:center;gap:5px}
#dots i{display:block;height:6px;width:6px;border-radius:3px;background:#5d5a66;opacity:.35}
#pill{position:absolute;top:533px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.85);border-radius:16px;height:28px;padding:0 13px 0 6px;display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:#1b1b1f;white-space:nowrap}
#pill b{width:19px;height:19px;border-radius:50%;background:linear-gradient(#ff6fa9,#b84cf0);display:flex;align-items:center;justify-content:center}
#title{position:absolute;top:568px;width:720px;text-align:center;font-weight:800;font-size:17px;color:#111}
#artist{position:absolute;top:589px;width:720px;text-align:center;font-size:13.5px;color:#77737f;font-weight:500}
#bar{position:absolute;left:78px;top:622px;width:564px;height:5px;border-radius:3px;background:rgba(80,70,100,.18)}
#barf{height:100%;border-radius:3px;background:#1d1b22}
#t0,#t1{position:absolute;top:637px;font-size:12px;color:#55515d;font-weight:600}
#t0{left:78px}#t1{right:78px}
#cover{position:absolute;left:228px;top:110px;width:264px;height:264px;border-radius:10px;box-shadow:0 20px 40px rgba(40,10,40,.35)}
#coverRefl{position:absolute;left:228px;top:378px;width:264px;height:90px;transform:scaleY(-1);opacity:.18;-webkit-mask-image:linear-gradient(transparent 30%,#000);border-radius:10px}
#ctitle{position:absolute;top:470px;width:720px;text-align:center;font-weight:800;font-size:30px;color:#3a3540}
#cartist{position:absolute;top:510px;width:720px;text-align:center;font-weight:700;font-size:18px;color:#b08ae8}
#orb{position:absolute;left:360px;top:330px;width:0;height:0}
#orb .o{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
.row{position:absolute;left:20px;height:34px;border-radius:10px;background:#f2f2f6;display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:600;color:#222}
</style></head>
<body>

 <filter id="mb0" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="mbg0" stdDeviation="0 0"/></filter>

  <div class="m" id="nt"><div class="ico" id="nti" style="width:36px;height:36px;border-radius:10px"></div><div><div class="tt" id="ntt"></div><div class="ts" id="nts"></div></div><div class="ts" style="margin-left:auto;font-size:11px">сейчас</div></div>
 </div>

<script>
const CFG = window.CFG || {title:'Рэперы тоже могут любить', artist:'сингл · 2026', pill:'слушай и запоминай', dur:40};
const A = window.AUDIO;
const W=720,H=720;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=p=>1-Math.pow(1-clamp(p),3);
const eio=p=>{p=clamp(p);return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
const spr=p=>p<=0?0:1-Math.exp(-5.2*p)*Math.cos(9.5*p);
const back=p=>{p=clamp(p);const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const ph=(t,t0,d)=>clamp((t-t0)/d);
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const env=(t,k=7)=>{let e=0;for(const [kt,s] of A.kicks){if(kt>t)break;e+=s*Math.exp(-(t-kt)*k)}return Math.min(e,1.3)};
const rmsAt=t=>{const i=Math.floor(t*60);return A.rms[Math.max(0,Math.min(A.rms.length-1,i))]||0};

 music:'<path d="M9 18V5l11-2v13" stroke="#fff" stroke-width="2.4" fill="none"/><circle cx="6.5" cy="18" r="3" fill="#fff"/><circle cx="17.5" cy="16" r="3" fill="#fff"/>',

 warn:'<path fill="#fff" d="M12 3l10 18H2z"/><rect x="11" y="9" width="2" height="6" fill="#8E8E93"/><rect x="11" y="16.5" width="2" height="2" fill="#8E8E93"/>',
};
const ico=(g,c,sz=32)=>`<div class="ico" style="background:${c};width:${sz}px;height:${sz}px"><svg viewBox="0 0 24 24">${G[g]}</svg></div>`;
const hdr=(g,c,t,s)=>`<div class="hdr">${ico(g,c)}<div><div class="ht">${t}</div><div class="hs">${s}</div></div></div>`;
const HEART=(c,sz)=>`<svg viewBox="0 0 24 24" width="${sz}" height="${sz}"><path fill="${c}" d="M12 21s-8.5-5.4-8.5-11.3A4.7 4.7 0 0112 7a4.7 4.7 0 018.5 2.7C20.5 15.6 12 21 12 21z"/></svg>`;
const STAR=(c,sz)=>`<svg viewBox="0 0 24 24" width="${sz}" height="${sz}"><path fill="${c}" d="M12 2l3 6.6 7 .7-5.3 4.8 1.6 7L12 17.6 5.7 21l1.6-7L2 9.3l7-.7z"/></svg>`;

// ---------- cards ----------
// t0 = cut time (on beat), enter style
const CARDS=[
{t0:1.08,enter:'zoom',bg:'linear-gradient(160deg,#fff 40%,#ffe3ef)',notif:null,
 html:hdr('star','#FF2D55','Рейтинг','Только для тебя')+
 `<div class="abs lbl" style="left:40px;top:262px">Для всех</div><div class="abs lbl" style="left:132px;top:262px;color:#FF2D55">Для тебя</div>
  <div class="abs" data-k="b1" style="left:44px;bottom:44px;width:44px;border-radius:10px 10px 4px 4px;background:#d6d4dc"></div>
  <div class="abs" data-k="b2" style="left:134px;bottom:44px;width:44px;border-radius:10px 10px 4px 4px;background:linear-gradient(#ff7aa8,#ff2d55)"></div>
  <div class="abs" data-k="n1" style="left:121px;top:84px;font-weight:800;font-size:22px;color:#ff2d55;width:70px;text-align:center">№1</div>
  <div class="abs lbl" style="left:268px;top:92px">Статус</div>
  <div class="abs" data-k="w1" style="left:266px;top:108px;font-weight:800;font-size:38px;color:#111;letter-spacing:-1px">самый</div>
  <div class="abs" data-k="w2" style="left:266px;top:150px;font-weight:800;font-size:46px;color:#ff2d55;letter-spacing:-1.5px">лучший</div>
  <div class="chip" data-k="c" style="left:268px;top:222px;background:#ff2d55">только для тебя ♥</div>`,
 up(c,lt,t){const g=eo(ph(t,1.1,.7));c.k.b1.style.height=(28*g)+'px';c.k.b2.style.height=(150*spr(ph(t,1.15,1.0)))+'px';
  pop(c.k.n1,t,1.6);pop(c.k.w1,t,2.1);pop(c.k.w2,t,2.33,1.25);pop(c.k.c,t,2.45)}},
{t0:2.72,enter:'swing',bg:'#fff',notif:{g:'shield',c:'#FF3B30',t:'Защита',s:'Если обидят — разберусь'},
 html:hdr('shield','#FF3B30','Защита','Режим охраны')+
 `<div class="abs" data-k="ring" style="left:52px;top:84px;width:170px;height:170px;border-radius:50%;border:3px solid #ff3b30"></div>
  <div class="abs" data-k="ring2" style="left:52px;top:84px;width:170px;height:170px;border-radius:50%;border:3px solid #ff3b30"></div>
  <svg class="abs" data-k="sh" style="left:87px;top:116px" width="100" height="108" viewBox="0 0 24 26"><path fill="url(#sg)" d="M12 1l10 3.5v7.5c0 6-4.3 11.3-10 13-5.7-1.7-10-7-10-13V4.5z"/><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset="1" stop-color="#d81f26"/></linearGradient></defs><path d="M7.5 13l3 3 6-6.5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="abs lbl" style="left:270px;top:84px">Обидчик</div>
  <div class="chip" data-k="st1" style="left:270px;top:102px;background:#ff9500">обнаружен</div>
  <div class="chip" data-k="st2" style="left:270px;top:102px;background:#ff3b30">устранён ✕</div>
  <div class="abs lbl" style="left:270px;top:150px">Готовность</div>
  <div class="abs" style="left:270px;top:168px;width:200px;height:10px;border-radius:5px;background:#f0e9ea"><div data-k="pb" style="height:100%;border-radius:5px;background:linear-gradient(90deg,#ff9a8b,#ff3b30)"></div></div>
  <div class="abs" data-k="pc" style="left:270px;top:190px;font-weight:800;font-size:36px;color:#111">0%</div>`,
 up(c,lt,t){const r=(lt*1.6)%1;c.k.ring.style.transform=`scale(${.6+r*.7})`;c.k.ring.style.opacity=1-r;
  const r2=(lt*1.6+.5)%1;c.k.ring2.style.transform=`scale(${.6+r2*.7})`;c.k.ring2.style.opacity=1-r2;
  const k=t>=4.73;c.k.st1.style.opacity=k?0:1;pop(c.k.st2,t,4.73,1.3);
  const p=eio(ph(t,2.9,1.8));c.k.pb.style.width=(p*100)+'%';c.k.pc.textContent=Math.round(p*100)+'%';
  c.k.sh.style.transform=`scale(${1+.18*Math.exp(-Math.max(0,t-4.73)*6)*(t>=4.73)})`}},
{t0:5.18,enter:'drop',bg:'repeating-linear-gradient(#fffbea 0 33px,#f2e6c0 33px 34px)',notif:null,
 html:hdr('note','#FFCC00','Заметки','Слушай и запоминай')+
 `<div class="abs lbl" data-k="z" style="left:24px;top:78px;color:#b8941b">ЗАПОМНИ:</div>
  <div class="abs" data-k="sl" style="left:24px;top:96px;font-weight:700;font-size:20px;color:#8a7a4a"></div><div class="abs" style="left:24px;top:130px;width:460px;font-weight:800;font-size:38px;line-height:1.08;color:#1c1c1e;letter-spacing:-1px"><span data-k="w0">Рэперы </span><span data-k="w1">тоже </span><span data-k="w2">могут </span><span data-k="w3" style="color:#ff2d55">любить</span><span data-k="cur" style="color:#ffb800;font-weight:400">|</span></div>
  <div class="abs" data-k="hh" style="left:405px;top:205px">${HEART('#ff2d55',70)}</div>`,
 up(c,lt,t){const sl='Слушай и запоминай:';c.k.sl.textContent=sl.slice(0,Math.floor(clamp((t-5.25)/1.2)*sl.length));const ws=[6.83,7.35,7.55,7.89];ws.forEach((w,i)=>{const e=c.k['w'+i];e.style.opacity=t>=w?1:0});
  c.k.cur.style.opacity=(Math.floor(t*3)%2)?1:0;pop(c.k.hh,t,7.92,1.4);c.k.hh.style.transform+=` rotate(${Math.sin(t*5)*8}deg)`}},
{t0:8.23,enter:'swing',bg:'#fff',notif:{g:'funnel',c:'#AF52DE',t:'Фильтр',s:'Всё лишнее заблокировано'},
 html:hdr('funnel','#AF52DE','Фильтр','Всё лишнее — в блок')+
 [['Чужие девушки',78],['Алкоголь',124],['Вредные привычки',170]].map(([s,y],i)=>`<div class="row" style="top:${y}px;width:300px"><span data-k="r${i}">${s}</span><span class="chip" data-k="x${i}" style="position:static;margin-left:auto;background:#ff3b30;padding:3px 9px;font-size:11px">✕ блок</span></div><div class="abs" data-k="l${i}" style="left:32px;top:${y+17}px;height:2.5px;background:#ff3b30;border-radius:2px"></div>`).join('')+
 `<div class="abs lbl" style="left:360px;top:90px">Заблокировано</div><div class="abs" data-k="cnt" style="left:356px;top:104px;font-weight:800;font-size:96px;color:#AF52DE;letter-spacing:-3px">0</div>
  <div class="chip" style="left:30px;top:238px;background:#AF52DE" data-k="ok">только ты ♥</div>`,
 up(c,lt,t){const ts=[8.41,9.17,9.93];let n=0;ts.forEach((w,i)=>{const p=eo(ph(t,w,.18));c.k['l'+i].style.width=(p*[110,78,150][i])+'px';
  pop(c.k['x'+i],t,w+.05);c.k['r'+i].style.color=t>=w?'#aaa':'#222';if(t>=w)n++});
  c.k.cnt.textContent=n;c.k.cnt.style.transform=`scale(${1+.25*Math.exp(-(t-[8.41,9.17,9.93][Math.max(0,n-1)])*8)*(n>0)})`;pop(c.k.ok,t,10.2)}},
{t0:10.54,enter:'zoom',bg:'linear-gradient(160deg,#f6fff8,#e3f8e9)',notif:null,
 html:hdr('bolt','#34C759','Батарея','Заменить невозможно')+
 `<div class="abs lbl" style="left:40px;top:96px">Другие</div><div class="abs lbl" style="left:40px;top:180px;color:#1f9d45">Ты</div>
  ${[0,1].map(i=>`<div class="abs" style="left:40px;top:${112+i*84}px;width:330px;height:54px;border-radius:14px;border:3px solid ${i?'#34C759':'#c9c9cf'};padding:4px"><div data-k="f${i}" style="height:100%;border-radius:9px;background:${i?'linear-gradient(90deg,#7ee69a,#34C759)':'#ff3b30'}"></div></div><div class="abs" style="left:374px;top:${130+i*84}px;width:7px;height:18px;border-radius:0 4px 4px 0;background:${i?'#34C759':'#c9c9cf'}"></div>`).join('')}
  <div class="abs" data-k="p0" style="left:396px;top:116px;font-weight:800;font-size:34px;color:#ff3b30">1%</div>

{t0:13.14,enter:'drop',bg:'#fff',notif:{g:'heart',c:'#FF2D55',t:'Здоровье',s:'Статус: неуязвим',at:14.25},
 html:hdr('search','#007AFF','Поиск','Лучше, чем она')+
 `<div class="abs" style="left:20px;top:72px;width:470px;height:38px;border-radius:12px;background:#f0f0f4;display:flex;align-items:center;padding:0 12px;gap:8px;font-size:15px;font-weight:600;color:#222"><svg viewBox="0 0 24 24" width="16" height="16">${G.search.replace(/#fff/g,'#8e8e93')}</svg><span data-k="q"></span><span data-k="cur" style="color:#007AFF">|</span></div>
